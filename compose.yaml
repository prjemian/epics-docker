# compose.yaml -- primary run contract for v3 (docker compose / podman compose).
#
# Choose a networking profile:
#   host  : Linux/CI fast path; host clients see PVs directly (like v2).
#   ports : Docker Desktop / Windows / macOS / Synology; CA/PVA port-mapped.
#
# Enable a profile with:  docker compose --profile host up   (or --profile ports)
#
# Select the IOC persona and prefix per service via environment.

services:

  # --- softIoc persona, host networking (Linux/CI) ---------------------
  softioc-host:
    profiles: ["host"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc-softioc
    network_mode: host
    environment:
      IOC: softioc
      PREFIX: ${PREFIX:-ioc:}
    restart: unless-stopped

  # --- softIoc persona, port-mapped (Desktop/Win/Mac/Synology) ---------
  softioc-ports:
    profiles: ["ports"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc-softioc
    environment:
      IOC: softioc
      PREFIX: ${PREFIX:-ioc:}
    ports:
      # Channel Access
      - "5064:5064/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
      # pvAccess
      - "5075:5075/tcp"
      - "5076:5076/udp"
    restart: unless-stopped

  # --- adsim persona (custom ADSimDetector), host networking (Linux/CI) -
  adsim-host:
    profiles: ["host"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${ADSIM_PREFIX:-adsim}
    network_mode: host
    environment:
      IOC: adsim
      PREFIX: "${ADSIM_PREFIX:-adsim}:"
    restart: unless-stopped

  # --- adsim persona (custom ADSimDetector), port-mapped ---------------
  adsim-ports:
    profiles: ["ports"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${ADSIM_PREFIX:-adsim}
    environment:
      IOC: adsim
      PREFIX: "${ADSIM_PREFIX:-adsim}:"
    ports:
      # Channel Access
      - "5064:5064/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
      # pvAccess
      - "5075:5075/tcp"
      - "5076:5076/udp"
    restart: unless-stopped

  # --- gp persona (customized synApps), host networking (Linux/CI) -----
  gp-host:
    profiles: ["host"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${GP_PREFIX:-gp}
    network_mode: host
    environment:
      IOC: gp
      PREFIX: "${GP_PREFIX:-gp}:"
    restart: unless-stopped

  # --- gp persona (customized synApps), port-mapped -------------------
  gp-ports:
    profiles: ["ports"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${GP_PREFIX:-gp}
    environment:
      IOC: gp
      PREFIX: "${GP_PREFIX:-gp}:"
    ports:
      # Channel Access
      - "5064:5064/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
      # pvAccess
      - "5075:5075/tcp"
      - "5076:5076/udp"
    restart: unless-stopped

  # --- additional areaDetector cameras (hardware-free) -----------------
  # adcsim = ADC/waveform digitizer (det1:); adurl = images from a URL;
  # adpva  = images over pvAccess. Each has host + ports profiles, like adsim.

  adcsim-host:
    profiles: ["host"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${ADCSIM_PREFIX:-adcsim}
    network_mode: host
    environment: { IOC: adcsim, PREFIX: "${ADCSIM_PREFIX:-adcsim}:" }
    restart: unless-stopped
  adcsim-ports:
    profiles: ["ports"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${ADCSIM_PREFIX:-adcsim}
    environment: { IOC: adcsim, PREFIX: "${ADCSIM_PREFIX:-adcsim}:" }
    ports:
      - "5064:5064/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
      - "5075:5075/tcp"
      - "5076:5076/udp"
    restart: unless-stopped

  adurl-host:
    profiles: ["host"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${ADURL_PREFIX:-adurl}
    network_mode: host
    environment: { IOC: adurl, PREFIX: "${ADURL_PREFIX:-adurl}:" }
    restart: unless-stopped
  adurl-ports:
    profiles: ["ports"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${ADURL_PREFIX:-adurl}
    environment: { IOC: adurl, PREFIX: "${ADURL_PREFIX:-adurl}:" }
    ports:
      - "5064:5064/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
      - "5075:5075/tcp"
      - "5076:5076/udp"
    restart: unless-stopped

  adpva-host:
    profiles: ["host"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${ADPVA_PREFIX:-adpva}
    network_mode: host
    environment: { IOC: adpva, PREFIX: "${ADPVA_PREFIX:-adpva}:" }
    restart: unless-stopped
  adpva-ports:
    profiles: ["ports"]
    image: prjemian/synapps:${TAG:-3.0.0-dev}
    container_name: ioc${ADPVA_PREFIX:-adpva}
    environment: { IOC: adpva, PREFIX: "${ADPVA_PREFIX:-adpva}:" }
    ports:
      - "5064:5064/tcp"
      - "5064:5064/udp"
      - "5065:5065/udp"
      - "5075:5075/tcp"
      - "5076:5076/udp"
    restart: unless-stopped
